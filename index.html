<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mind Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --radius-lg: 22px;
    --radius-md: 16px;
    --radius-sm: 12px;
  }

  /* ---- Theme: Diagonal (default) -- hard mint/coral split, one blue accent ---- */
  body[data-theme="diagonal"]{
    --paper: linear-gradient(160deg, #F0FBF6 0%, #FDF2EE 100%);
    --sheet-shadow: rgba(0,0,0,0.25);
    --paper-raised: #FFFFFF;
    --ink: #2E2E33;
    --ink-soft: #9C9CA6;
    --plum: #6FB9E7; --plum-deep: #4596C8; --plum-tint:#E4F4FC; --plum-shadow: rgba(69,150,200,0.45);
    --header-tint: rgba(255,178,153,0.35);
    --entry-bg: rgba(255,255,255,0.91);
    --plum-card: rgba(111,185,231,0.97); --plum-card-deep: rgba(69,150,200,0.98);
    --amber: #FFB099; --amber-deep: #E98169; --amber-tint:#FFEAE3; --amber-shadow: rgba(233,129,105,0.45);
    --amber-card: rgba(255,176,153,0.97); --amber-card-deep: rgba(233,129,105,0.98);
    --green: #6FB9E7; --green-deep: #4596C8; --green-shadow: rgba(69,150,200,0.5);
    --gold-soft: #FFEDE8; --line: #ECECF0; --danger: #E8768E; --blur: 0px; --card-blur: 0px;
    background: linear-gradient(135deg, #B9F2DC 0%, #B9F2DC 50%, #FFD1C2 50%, #FFD1C2 100%);
    background-attachment: fixed;
  }

  /* ---- Theme: Glass -- warm tan/sage gradient, frosted glass cards, Morandi blue+sage accents ---- */
  body[data-theme="glass"]{
    --paper: linear-gradient(160deg, #FBF6ED 0%, #F1E7D5 100%);
    --sheet-shadow: rgba(80,60,30,0.28);
    --paper-raised: rgba(255,255,255,0.7);
    --ink: #33312C;
    --ink-soft: #8A8579;
    --plum: #7C93A0; --plum-deep: #5C7680; --plum-tint: rgba(124,147,160,0.18); --plum-shadow: rgba(92,118,128,0.4);
    --header-tint: var(--plum-tint);
    --entry-bg: rgba(255,255,255,0.85);
    --plum-card: var(--plum); --plum-card-deep: var(--plum-deep);
    --amber: #C4906B; --amber-deep: #9C6B47; --amber-tint:#F3E4D6; --amber-shadow: rgba(156,107,71,0.4);
    --amber-card: var(--amber); --amber-card-deep: var(--amber-deep);
    --green: #93A889; --green-deep: #708571; --green-shadow: rgba(112,133,113,0.45);
    --gold-soft: #FCE8DC; --line: rgba(255,255,255,0.55); --danger: #C0503B; --blur: 16px; --card-blur: 0px;
    background: linear-gradient(135deg, #E9CFA3 0%, #D9C79A 35%, #B7C3A4 70%, #9FB3A0 100%);
  }

  /* ---- Theme: Pastel -- soft mint/pink/blue gradient, baby-color accents ---- */
  body[data-theme="pastel"]{
    --paper: linear-gradient(160deg, #FFFFFF 0%, #FDF1F6 55%, #EFF8FF 100%);
    --sheet-shadow: rgba(95,140,190,0.22);
    --paper-raised: #FFFFFF;
    --ink: #3A3A3F;
    --ink-soft: #9B9BA5;
    --plum: #5FB3E0; --plum-deep: #3F8FC0; --plum-tint:#E4F4FC; --plum-shadow: rgba(63,143,192,0.4);
    --header-tint: rgba(247,168,192,0.35);
    --entry-bg: rgba(255,255,255,0.92);
    --plum-card: var(--plum); --plum-card-deep: var(--plum-deep);
    --amber: #F7A8C0; --amber-deep: #E17999; --amber-tint:#FDE7EE; --amber-shadow: rgba(225,121,153,0.4);
    --amber-card: var(--amber); --amber-card-deep: var(--amber-deep);
    --green: #6FDBB4; --green-deep: #3FAE85; --green-shadow: rgba(63,174,133,0.5);
    --gold-soft: #FCEFF3; --line: #E9EEF2; --danger: #E8768E; --blur: 0px; --card-blur: 0px;
    background: linear-gradient(135deg, #D6F5E8 0%, #FDE9F0 55%, #DCEDFC 100%);
  }

  /* ---- Theme: Butter -- warm buttery cream gradient, honey/toffee accents ---- */
  body[data-theme="butter"]{
    --paper: linear-gradient(160deg, #FFFBF0 0%, #FFF3D6 100%);
    --sheet-shadow: rgba(120,90,20,0.22);
    --paper-raised: #FFFFFF;
    --ink: #3A2F1F;
    --ink-soft: #A0916F;
    --plum: #D9A441; --plum-deep: #B8822A; --plum-tint:#FDF1D6; --plum-shadow: rgba(184,130,42,0.4);
    --header-tint: rgba(255,224,130,0.35);
    --entry-bg: rgba(255,255,255,0.92);
    --plum-card: var(--plum); --plum-card-deep: var(--plum-deep);
    --amber: #C9915B; --amber-deep: #A66F3D; --amber-tint:#F5E6D3; --amber-shadow: rgba(166,111,61,0.4);
    --amber-card: var(--amber); --amber-card-deep: var(--amber-deep);
    --green: #D9A441; --green-deep: #B8822A; --green-shadow: rgba(184,130,42,0.5);
    --gold-soft: #FFF3D6; --line: #F0E4C8; --danger: #C9573A; --blur: 0px; --card-blur: 0px;
    background: linear-gradient(135deg, #FFF8E1 0%, #FFE9A8 100%);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;}
  body{
    margin:0; color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    display:flex; justify-content:center; min-height:100vh;
  }
  #app{
    width:100%; max-width:460px; min-height:100vh; background:transparent;
    position:relative; display:flex; flex-direction:column; padding-bottom:100px;
  }
  header{ padding: 32px 24px 12px; }
  .header-top{ display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .brand-row{ display:flex; align-items:center; gap:12px; cursor:pointer; }
  .brand-logo{ height:42px; width:auto; border-radius:12px; box-shadow:0 3px 10px rgba(0,0,0,0.15); display:block; flex-shrink:0; }
  .wordmark{
    font-family:'Fraunces', serif; font-weight:500; font-size:30px;
    letter-spacing:-0.01em; color:var(--ink); margin:0;
  }
  .tagline{ font-size:13px; color:var(--ink-soft); margin:4px 0 0; font-style:italic; font-family:'Fraunces', serif; }
  .search-wrap{ margin:20px 24px 0; position:relative; }
  .search-wrap input{
    width:100%; padding:14px 44px 14px 18px; border-radius: 999px; border:1px solid var(--line);
    background:var(--paper-raised); backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur)); font-size:15px; color:var(--ink); font-family:'Inter',sans-serif;
    outline:none; transition:border-color .2s, box-shadow .2s;
  }
  .search-wrap input:focus{ border-color:var(--plum); box-shadow:0 0 0 3px rgba(75,63,114,0.12); }
  .search-wrap .icon{ position:absolute; right:16px; top:50%; transform:translateY(-50%); color:var(--ink-soft); pointer-events:none; }
  .search-wrap .clear-btn{
    pointer-events:auto; background:var(--ink-soft); color:#fff; border:none; border-radius:50%;
    width:18px; height:18px; font-size:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0;
  }
  .section{ margin-top:28px; padding:0 24px; }
  .section-label{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .section-label span{ font-size:12px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-soft); font-weight:600; }
  .shuffle-btn{ background:none; border:none; color:var(--plum); font-size:13px; font-weight:600; display:flex; align-items:center; gap:5px; cursor:pointer; padding:4px 8px; }
  .shuffle-btn.amber{ color:var(--amber-deep); }
  .shuffle-btn:active{ opacity:0.5; }

  .flip-scene{ perspective:1400px; }
  .flip-card{ position:relative; width:100%; min-height:150px; transform-style:preserve-3d; transition:transform .6s cubic-bezier(.25,.8,.25,1); cursor:pointer; }
  .flip-card.flipping{ transform:rotateY(180deg); }
  .flip-face{
    position:absolute; inset:0; backface-visibility:hidden;
    background: linear-gradient(155deg, var(--plum-card) 0%, var(--plum-card-deep) 100%);
    backdrop-filter: blur(var(--card-blur)); -webkit-backdrop-filter: blur(var(--card-blur));
    border-radius:var(--radius-lg); padding:22px; display:flex; flex-direction:column; justify-content:center;
    color:#fff; box-shadow: 0 10px 30px -12px var(--plum-shadow);
  }
  .flip-face.forgotten{
    background: linear-gradient(155deg, var(--amber-card) 0%, var(--amber-card-deep) 100%);
    box-shadow: 0 10px 30px -12px var(--amber-shadow);
  }
  .flip-face.back{ transform:rotateY(180deg); }
  .flip-face .eyebrow{ font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--gold-soft); font-weight:600; margin-bottom:8px; }
  .flip-face.forgotten .eyebrow{ color:#FBEAD3; }
  .flip-face .rtitle{ font-family:'Fraunces', serif; font-size:21px; font-weight:700; line-height:1.3; margin:0 0 6px; text-shadow: 0 1px 4px rgba(0,0,0,0.35); }
  .flip-face .rcontent{ font-size:14px; line-height:1.5; color:rgba(255,255,255,0.85); max-height:70px; overflow:hidden; }
  .flip-face .rmeta{ margin-top:14px; font-size:11.5px; color:rgba(255,255,255,0.6); }
  .empty-note{ font-size:14px; color:var(--ink-soft); padding:20px; background:var(--paper-raised); backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur)); border-radius:var(--radius-md); text-align:center; }

  .entry-row{ position:relative; overflow:hidden; border-radius:var(--radius-md); margin-bottom:10px; }
  .entry-row .delete-bg{ position:absolute; inset:0; background:var(--danger); display:flex; align-items:center; justify-content:flex-end; padding-right:22px; color:#fff; font-size:13px; font-weight:600; }
  .entry-card{ position:relative; background:var(--entry-bg); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border:1px solid rgba(255,255,255,0.6); border-radius:var(--radius-md); padding:14px 16px; display:flex; flex-direction:column; gap:3px; transition:transform .18s ease; touch-action:pan-y; user-select:none; box-shadow:0 4px 16px -6px rgba(0,0,0,0.14); }
  .entry-card .etitle{ font-family:'Fraunces', serif; font-size:16px; font-weight:500; color:var(--ink); }
  .entry-card .esnippet{ font-size:13px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .entry-card .ebadges{ margin-top:4px; display:flex; gap:6px; }
  .badge{ font-size:11px; color:var(--plum-deep); background:var(--plum-tint); padding:2px 7px; border-radius:999px; }

  .fab{
    position:fixed; bottom:28px; left:50%; transform:translateX(calc(-50% + 190px));
    width:58px; height:58px; border-radius:50%; background:var(--green); color:#fff; border:none;
    font-size:28px; line-height:1; box-shadow:0 12px 24px -8px var(--green-shadow);
    cursor:pointer; display:flex; align-items:center; justify-content:center; z-index:40;
  }
  .fab:active{ transform:translateX(calc(-50% + 190px)) scale(0.94); }
  @media (max-width:460px){
    .fab{ transform:translateX(0); left:auto; right:24px; }
    .fab:active{ transform:scale(0.94); }
  }

  .sheet-overlay{
    position:fixed; inset:0; background:rgba(30,26,20,0.4);
    display:none; align-items:center; justify-content:center; z-index:100; padding:24px;
  }
  .sheet-overlay.open{ display:flex; }
  .sheet{
    width:100%; max-width:420px; background:var(--paper); border-radius:26px;
    padding:26px 22px 24px; max-height:82vh; overflow-y:auto; animation:popIn .2s ease;
    box-shadow: 0 20px 50px -12px var(--sheet-shadow);
  }
  @keyframes popIn{ from{ opacity:0; transform:scale(0.96);} to{opacity:1; transform:scale(1);} }
  .sheet h2{ font-family:'Fraunces', serif; font-weight:500; font-size:20px; margin:0 0 18px; }
  label.field-label{ font-size:12px; font-weight:600; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; display:block; margin:16px 0 6px; }
  input.field, textarea.field{
    width:100%; border:1px solid var(--line); background:var(--paper-raised); backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur)); border-radius:var(--radius-sm);
    padding:12px 14px; font-size:15px; font-family:'Inter',sans-serif; color:var(--ink); outline:none; resize:vertical;
  }
  input.field:focus, textarea.field:focus{ border-color:var(--plum); }
  textarea.field{ min-height:110px; line-height:1.5; }

  .attach-row{ display:flex; gap:10px; margin-top:12px; }
  .attach-btn{ flex:1; display:flex; align-items:center; justify-content:center; gap:6px; padding:11px; border-radius:var(--radius-sm); border:1px dashed var(--line); background:var(--paper-raised); backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur)); font-size:13px; color:var(--ink-soft); cursor:pointer; }
  .attach-btn.active{ border:1px solid var(--plum); color:var(--plum-deep); background:var(--plum-tint); }
  .attach-btn.recording{ border:1px solid var(--danger); color:var(--danger); background:#FBEAE6; }

  .photo-strip{ display:flex; gap:8px; margin-top:8px; flex-wrap:wrap; }
  .photo-tile{ position:relative; width:72px; height:72px; border-radius:12px; overflow:hidden; background:var(--paper-raised); backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur)); border:1px solid var(--line); flex-shrink:0; }
  .photo-tile img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-tile.add-tile{ display:flex; align-items:center; justify-content:center; font-size:24px; color:var(--ink-soft); cursor:pointer; border-style:dashed; }
  .photo-tile .remove-attach{ position:absolute; top:2px; right:2px; width:20px; height:20px; font-size:10px; border-radius:50%; background:rgba(0,0,0,0.55); color:#fff; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
  .hint-text{ font-size:11.5px; color:var(--ink-soft); font-weight:400; text-transform:none; letter-spacing:0; }

  .preview-wrap{ margin-top:10px; }
  audio.preview-audio{ width:100%; display:block; }
  .audio-actions{ display:flex; gap:10px; margin-top:8px; }
  .audio-action-btn{
    flex:1; text-align:center; padding:9px; border-radius:999px; border:1px solid var(--line);
    background:var(--paper-raised); backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur)); font-size:12.5px; color:var(--ink-soft); cursor:pointer; text-decoration:none;
  }
  .audio-action-btn.danger{ color:var(--danger); border-color:#F0D2CA; background:#FBEAE6; }

  .primary-btn{ width:100%; padding:15px; border:none; border-radius:999px; background:var(--green); color:#fff; font-size:15px; font-weight:600; margin-top:22px; cursor:pointer; }
  .primary-btn:active{ background:var(--green-deep); }
  .text-btn{ width:100%; padding:13px; border:none; background:none; color:var(--ink-soft); font-size:14px; margin-top:6px; cursor:pointer; }

  .audio-row{ display:flex; align-items:center; gap:8px; margin-top:14px; }
  .audio-row audio{ flex:1; min-width:0; }
  .more-btn.small{ width:28px; height:28px; font-size:14px; flex-shrink:0; }
  #audioMoreMenu, #addAudioMoreMenu{ top:32px; }

  .detail-header{
    display:flex; justify-content:space-between; align-items:flex-start; gap:12px;
    background: var(--header-tint); border-radius: 18px; padding: 16px 16px 14px;
    margin: -8px -6px 16px -6px;
  }
  .detail-header .detail-title{ margin:0; flex:1; }
  .detail-title{ font-family:'Fraunces', serif; font-size:23px; font-weight:500; }
  .detail-header-actions{ display:flex; gap:8px; flex-shrink:0; }
  .star-btn, .more-btn{ background:var(--paper-raised); backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur)); border:1px solid var(--line); width:34px; height:34px; border-radius:50%; font-size:16px; line-height:1; color:var(--ink-soft); cursor:pointer; }
  .star-btn.active{ background:var(--amber-tint); border-color:var(--amber-deep); color:var(--amber-deep); }
  .more-menu{
    position:absolute; top:40px; right:0; background:var(--paper-raised); backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur)); border:1px solid var(--line);
    border-radius:14px; overflow:hidden; box-shadow:0 8px 24px -8px rgba(0,0,0,0.2); display:none; z-index:10; min-width:120px;
  }
  .more-menu.open{ display:block; }
  .more-menu button, .more-menu a{ display:block; width:100%; text-align:left; padding:12px 16px; border:none; background:none; font-size:14px; color:var(--ink); cursor:pointer; text-decoration:none; box-sizing:border-box; }
  .more-menu button:not(:last-child), .more-menu a:not(:last-child){ border-bottom:1px solid var(--line); }
  .more-menu button.danger{ color:var(--danger); }

  .detail-photos{ display:grid; grid-template-columns: repeat(2, 1fr); gap:8px; margin-top:16px; }
  .detail-photos img{ width:100%; aspect-ratio:1; border-radius:var(--radius-sm); object-fit:cover; cursor:pointer; }
  .lightbox-overlay{
    position:fixed; inset:0; background:rgba(20,18,15,0.88); z-index:300;
    display:none; align-items:center; justify-content:center; padding:24px; cursor:zoom-out;
  }
  .lightbox-overlay.open{ display:flex; }
  .lightbox-overlay img{ max-width:100%; max-height:100%; border-radius:12px; }
  .detail-content{ font-size:15px; line-height:1.65; color:#4a463f; white-space:pre-wrap; margin-top:4px; }
  .info-box{ margin-top:14px; font-size:12.5px; color:var(--ink-soft); background:var(--paper-raised); backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur)); border-radius:var(--radius-sm); padding:12px 14px; display:none; }
  .info-box.open{ display:block; }
  .info-toggle{ display:inline-flex; align-items:center; gap:5px; font-size:12.5px; color:var(--ink-soft); background:none; border:none; margin-top:14px; cursor:pointer; padding:0; }

  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff;
    padding:10px 18px; border-radius:999px; font-size:13px; opacity:0; pointer-events:none;
    transition:opacity .25s, transform .25s; z-index:200; max-width:80%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

  ::-webkit-scrollbar{ display:none; }
</style>
</head>
<body data-theme="diagonal">
<div id="app">

  <header>

  // Falls back to the browser's own localStorage when this file is opened
  // directly (not inside Claude's artifact viewer) or when signed out.
  // Once a user signs in, activeStorageImpl is swapped to a Firestore-backed
  // implementation scoped to their account, so the same storageAdapter.get/set/delete
  // calls throughout the app transparently start syncing to the cloud.
  const localStorageImpl = (function(){
    const hasCloudStorage = typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
    if(hasCloudStorage) return window.storage;
    return {
      async get(key){
        const raw = localStorage.getItem(key);
        if(raw === null) return null;
        return { key, value: raw };
      },
      async set(key, value){
        localStorage.setItem(key, value);
        return { key, value };
      },
      async delete(key){
        localStorage.removeItem(key);
        return { key, deleted:true };
      },
      async list(prefix){
        const keys = Object.keys(localStorage).filter(k => !prefix || k.startsWith(prefix));
        return { keys };
      }
    };
  })();

  function firestoreImplFor(uid){
    const fb = window.__firebase;
    const ref = (key) => fb.doc(fb.db, 'users', uid, 'kv', key);
    return {
      async get(key){
        const snap = await fb.getDoc(ref(key));
        if(!snap.exists()) return null;
        return { key, value: snap.data().value };
      },
      async set(key, value){
        await fb.setDoc(ref(key), { value, updatedAt: Date.now() });
        return { key, value };
      },
      async delete(key){
        try{ await fb.deleteDoc(ref(key)); }catch(e){}
        return { key, deleted:true };
      },
      async list(prefix){
        return { keys: [] }; // not used by the app currently
      }
    };
  }

  let currentLang = 'en';
  function T(){ return translations[currentLang]; }

  function cryptoId(){
    return 'e_' + Math.random().toString(36).slice(2,10) + Date.now().toString(36);
  }

  function showToast(msg){
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._hideTimer);
    t._hideTimer = setTimeout(()=> t.classList.remove('show'), 1800);
  }

  function toIndexObj(e){
    return {
      id: e.id, title: e.title, content: e.content,
      forgetCount: e.forgetCount||0, pinned: !!e.pinned,
      imageCount: e.imageCount||0, hasAudio: !!e.hasAudio,
      isSample: !!e.isSample,
      createdAt: e.createdAt, updatedAt: e.updatedAt
    };
  }

  async function persistIndex(){
    try{
      await storageAdapter.set(INDEX_KEY, JSON.stringify(entries.map(toIndexObj)), false);
    }catch(e){
      console.error('index save failed', e);
      showToast(T().toastSaveFail);
    }
  }

  async function ensureMedia(entry){
    if(entry.images !== undefined) return;
    if(!entry.imageCount && !entry.hasAudio){
      entry.images = [];
      entry.audio = null;
      return;
    }
    try{
      const res = await storageAdapter.get(mediaKey(entry.id), false);
      const data = res && res.value ? JSON.parse(res.value) : { images:[], audio:null };
      entry.images = data.images || [];
      entry.audio = data.audio || null;
    }catch(e){
      entry.images = [];
      entry.audio = null;
    }
  }

  async function persistMediaFor(entry){
    if(entry.imageCount > 0 || entry.hasAudio){
      try{
        await storageAdapter.set(mediaKey(entry.id), JSON.stringify({ images: entry.images||[], audio: entry.audio||null }), false);
      }catch(e){
        console.error('media save failed', e);
        showToast(T().toastMediaFail);
      }
    } else {
      try{ await storageAdapter.delete(mediaKey(entry.id), false); }catch(e){ /* nothing to delete, ignore */ }
    }
  }

  async function migrateLegacyOrSeed(){
    let legacy = null;
    try{
      const res = await storageAdapter.get(LEGACY_KEY, false);
      legacy = res && res.value ? JSON.parse(res.value) : null;
    }catch(e){ legacy = null; }

    if(legacy && legacy.length){
      const migrated = [];
      for(const e of legacy){
        const images = e.images || (e.image ? [e.image] : []);
        const audio = e.audio || null;
        const idxEntry = {
          id: e.id, title: e.title, content: e.content,
          forgetCount: typeof e.forgetCount === 'number' ? e.forgetCount : 0,
          pinned: !!e.pinned,
          imageCount: images.length, hasAudio: !!audio,
          createdAt: e.createdAt, updatedAt: e.updatedAt
        };
        migrated.push(idxEntry);
        if(images.length || audio){
          try{ await storageAdapter.set(mediaKey(e.id), JSON.stringify({ images, audio }), false); }catch(err){}
        }
      }
      entries = migrated;
    } else {
      entries = [];
    }
    await persistIndex();
  }

  async function loadEntries(){

      if(res && res.value){
        entries = JSON.parse(res.value);

      }
    }catch(e){
      await migrateLegacyOrSeed();
    }
    renderRecent();
    renderRandom();
    renderForgotten();
  }

  function timeAgo(ts){
    const days = Math.floor((Date.now() - ts) / (1000*60*60*24));
    if(currentLang === 'zh'){
      if(days < 1) return '今天';
      if(days === 1) return '昨天';
      if(days < 30) return days + ' 天前';
      const months = Math.floor(days/30);
      if(months < 12) return months + ' 个月前';
      const years = Math.floor(months/12);
      return years + ' 年前';
    }
    if(days < 1) return 'today';
    if(days === 1) return '1 day ago';
    if(days < 30) return days + ' days ago';
    const months = Math.floor(days/30);
    if(months < 12) return months + (months===1?' month ago':' months ago');
    const years = Math.floor(months/12);
    return years + (years===1?' year ago':' years ago');
  }

  function attachSwipe(row, id){
    const card = row.querySelector('.entry-card');
    let startX = 0, currentX = 0, dragging = false;

    function onStart(x){ startX = x; dragging = true; row.dataset.swiping = 'false'; }
    function onMove(x){
      if(!dragging) return;
      currentX = x - startX;
      if(currentX < 0){
        row.dataset.swiping = 'true';
        card.style.transform = `translateX(${Math.max(currentX,-90)}px)`;
      }
    }
    function onEnd(){
      dragging = false;
      if(currentX < -55){
        card.style.transform = 'translateX(-90px)';
        setTimeout(()=>{
          if(confirm(T().confirmDeleteEntry)){
            deleteEntry(id);
          } else {
            card.style.transform = 'translateX(0)';
            row.dataset.swiping = 'false';
          }
        }, 120);
      } else {
        card.style.transform = 'translateX(0)';
        setTimeout(()=> row.dataset.swiping = 'false', 50);
      }
      currentX = 0;
    }

    card.addEventListener('touchstart', (e)=> onStart(e.touches[0].clientX), {passive:true});
    card.addEventListener('touchmove', (e)=> onMove(e.touches[0].clientX), {passive:true});
    card.addEventListener('touchend', onEnd);

    card.addEventListener('mousedown', (e)=>{ e.preventDefault(); onStart(e.clientX); });
    card.addEventListener('mousemove', (e)=> onMove(e.clientX));
    card.addEventListener('mouseup', onEnd);
    card.addEventListener('mouseleave', ()=>{ if(dragging){ dragging=false; currentX=0; card.style.transform='translateX(0)'; } });
  }

  function pickRandomEntry(){

  }

  function weightedPick(weighted){
    const total = weighted.reduce((s,p)=> s+p.weight, 0);
    if(total <= 0) return weighted[0] ? weighted[0].entry : null;
    let r = Math.random() * total;
    for(const p of weighted){
      if(r < p.weight) return p.entry;
      r -= p.weight;
    }
    return weighted[weighted.length-1].entry;
  }

  function pickForgottenEntry(){
    const pool = entries.filter(e => e.forgetCount > 0 || e.pinned);
    if(pool.length === 0) return null;
    if(pool.length === 1) return pool[0];
    const maxExclude = Math.min(5, pool.length - 1);
    recentForgottenIds = recentForgottenIds.slice(-maxExclude);
    let avail = pool.filter(e => !recentForgottenIds.includes(e.id));
    if(avail.length === 0) avail = pool;
    const weighted = avail.map(e => ({ entry: e, weight: (e.forgetCount > 0 ? e.forgetCount : 0) + (e.pinned ? 2 : 0) }));
    const pick = weightedPick(weighted);
    if(pick) recentForgottenIds.push(pick.id);
    return pick;
  }

  $('voiceBtn').addEventListener('click', async ()=>{
    if(isRecording){ mediaRecorder.stop(); return; }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({ audio:true });
      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = (e)=> audioChunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(audioChunks, { type:'audio/webm' });
        const reader = new FileReader();
        reader.onload = () => {
          pendingAudioData = reader.result;
          $('audioPreview').src = pendingAudioData;
          $('downloadAudioBtn').href = pendingAudioData;
          $('audioPreviewWrap').style.display = '';
          $('voiceBtn').classList.add('active');
        };
        reader.readAsDataURL(blob);
        stream.getTracks().forEach(t=>t.stop());
        isRecording = false;
        $('voiceBtn').classList.remove('recording');
        $('voiceBtnLabel').textContent = T().addVoice;
      };
      mediaRecorder.start();

  function mapAuthError(err){
    const code = (err && err.code) || '';
    if(code.includes('weak-password')) return 'authErrorWeakPassword';
    if(code.includes('email-already-in-use')) return 'authErrorEmailInUse';
    if(code.includes('invalid-credential') || code.includes('wrong-password') || code.includes('user-not-found')) return 'authErrorInvalidCredential';
    return 'authErrorGeneric';
  }

    e.stopPropagation();
    if(isSignedIn){
      $('accountMenu').classList.toggle('open');
    } else {
      clearAuthError();
      showAuthOverlay();
    }
  });
  $('authCloseBtn').addEventListener('click', hideAuthOverlay);
  $('authOverlay').addEventListener('click', (e)=>{
    if(e.target.id === 'authOverlay') hideAuthOverlay();
  });
  $('signOutBtn').addEventListener('click', async ()=>{
    $('accountMenu').classList.remove('open');
    const fb = window.__firebase;
    try{ await fb.signOut(fb.auth); }catch(e){}
  });
  document.addEventListener('click', (e)=>{
    if($('accountMenu').classList.contains('open') && !$('accountMenu').contains(e.target) && e.target !== $('accountBtn')){
      $('accountMenu').classList.remove('open');
    }
  });

  async function migrateGuestDataToAccount(guestImpl){
    try{
      const existing = await activeStorageImpl.get(INDEX_KEY);
      if(existing && existing.value) return; // account already has its own data — don't overwrite
      const guestIndex = await guestImpl.get(INDEX_KEY);
      if(!guestIndex || !guestIndex.value) return; // nothing local to bring over
      const guestEntries = JSON.parse(guestIndex.value).filter(e => !e.isSample);
      if(guestEntries.length === 0) return; // only demo entries locally — nothing real to migrate
      await activeStorageImpl.set(INDEX_KEY, JSON.stringify(guestEntries));
      const idsToKeep = new Set(guestEntries.map(e => e.id));
      const mediaList = await guestImpl.list('entry-media:');
      for(const key of (mediaList && mediaList.keys) || []){
        const entryId = key.slice('entry-media:'.length);
        if(!idsToKeep.has(entryId)) continue; // skip media belonging to filtered-out sample entries
        const media = await guestImpl.get(key);
        if(media && media.value){ await activeStorageImpl.set(key, media.value); }
      }
      showToast(T().migratedGuestData);
    }catch(e){
      console.error('guest data migration failed', e);
    }
  }

  const SEEN_AUTH_PROMPT_KEY = 'mind-search-seen-auth-prompt';
  let hasDoneInitialAuthCheck = false;

  function initAuth(){
    const fb = window.__firebase;
    updateAuthModeUI();
    fb.onAuthStateChanged(fb.auth, async (user) => {
      const wasGuest = (activeStorageImpl === localStorageImpl);
      if(user){
        isSignedIn = true;
        activeStorageImpl = firestoreImplFor(user.uid);
        $('accountEmailLabel').textContent = T().signedInAs + (user.email || '');
        $('accountBtn').textContent = '👤';
        hideAuthOverlay();
        clearAuthError();
        if(wasGuest){ await migrateGuestDataToAccount(localStorageImpl); }
      } else {
        isSignedIn = false;
        activeStorageImpl = localStorageImpl;
        if(!hasDoneInitialAuthCheck){
          let seen = null;
          try{ seen = localStorage.getItem(SEEN_AUTH_PROMPT_KEY); }catch(e){}
          if(!seen){
            showAuthOverlay();
            try{ localStorage.setItem(SEEN_AUTH_PROMPT_KEY, '1'); }catch(e){}
          }
        }
      }
      hasDoneInitialAuthCheck = true;
      // reset in-memory state and reload from whichever backend is now active
      entries = [];
      recentRandomIds = [];
      recentForgottenIds = [];
      loadEntries();
    });
  }

  loadTheme();
  loadLanguage();

  if(window.__firebase){
    initAuth();
  } else {
    window.addEventListener('firebaseReady', initAuth, { once:true });
  }
})();
</script>
</body>
</html>
